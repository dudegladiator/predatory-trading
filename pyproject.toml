[project]
name = "predatory-trading"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# Raised inside Streamlit's own chart code, not ours.
filterwarnings = ["ignore:The inplace keyword in DataFrame.reset_index is deprecated"]
